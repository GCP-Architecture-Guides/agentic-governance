# Cloud Build pipeline for manual triggering to QA/Production environments
steps:
  # 0. Initialize and update git submodules (if .git folder is present)
  - name: 'gcr.io/cloud-builders/git'
    id: 'git-submodules'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -d .git ]; then
          git submodule init
          git submodule update --init --recursive
        else
          echo "No .git directory found (manual submission). Skipping submodule update."
        fi

  # =========================================================================
  # PHASE 1: Infrastructure Deployment (Terraform)
  # =========================================================================

  # 1. Initialize Terraform (using GCS backend for state management)
  - name: 'hashicorp/terraform:1.5.7'
    id: 'tf-init'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "$PROJECT_ID" = "agentic-security-dev" ]; then
          BUCKET="${PROJECT_ID}-tf-state"
        else
          BUCKET="${PROJECT_ID}-tfstate"
        fi
        terraform init -backend-config="bucket=$$BUCKET"

  # 2. Validate Terraform Configuration
  - name: 'hashicorp/terraform:1.5.7'
    id: 'tf-validate'
    args: ['validate']

  # 3a. Apply Terraform Configuration (provisions networks, SWP, dashboards, and metrics with alerts disabled)
  - name: 'hashicorp/terraform:1.5.7'
    id: 'tf-apply-metrics'
    args: ['apply', '-var-file=envs/$PROJECT_ID.terraform.tfvars', '-var=enable_token_alerts=false', '-var=enable_model_armor_security_alerts=false', '-var=iap_client_id=$_IAP_CLIENT_ID', '-var=iap_client_secret=$_IAP_CLIENT_SECRET', '-auto-approve']

  # 3b. Wait for Cloud Monitoring to index newly created metrics
  - name: 'google/cloud-sdk:slim'
    id: 'sleep-for-metrics'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Sleeping 90 seconds to allow Cloud Monitoring to index newly created metrics..."
        sleep 90

  # 3c. Apply Terraform Configuration (enables and creates the alert policies)
  - name: 'hashicorp/terraform:1.5.7'
    id: 'tf-apply-alerts'
    args: ['apply', '-var-file=envs/$PROJECT_ID.terraform.tfvars', '-var=iap_client_id=$_IAP_CLIENT_ID', '-var=iap_client_secret=$_IAP_CLIENT_SECRET', '-auto-approve']

  # =========================================================================
  # PHASE 2: Reasoning Engine Deployments (Vertex AI)
  # =========================================================================

  # 4. Deploy all 12 Reasoning Engines to Vertex AI
  - name: 'google/cloud-sdk:slim'
    id: 'deploy-agents'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        
        # Install python3-venv and rsync which are required for venv and syncing
        apt-get update && apt-get install -y python3-venv rsync
        
        # Skipping sync-app-bundle.sh in Cloud Build since all deployable source files
        # (backend, infra, scripts, tests) are already present and tracked under agentic-lens/app/
        echo "Deployable app bundle is already populated under agentic-lens/app/. Skipping sync."
        
        # Change into the synced app directory to install deps and deploy
        cd agentic-lens/app
        
        # Populate versions.env for target environment
        echo "PROJECT_ID=$PROJECT_ID" > versions.env
        echo "REGION=$_REGION" >> versions.env
        echo "MODEL_VERSION=$_MODEL_VERSION" >> versions.env
        echo "ORG_ID=$_ORG_ID" >> versions.env
        
        # Remove any pre-existing .venv symlinks/folders to avoid 'File exists' errors
        rm -rf .venv
        rm -rf agentic-lens/.venv

        # Set up python environment and install google-adk
        python3 -m venv .venv
        .venv/bin/pip install --upgrade pip
        .venv/bin/pip install -r requirements.txt
        
        python3 -m venv agentic-lens/.venv
        agentic-lens/.venv/bin/pip install --upgrade pip
        agentic-lens/.venv/bin/pip install -r agentic-lens/app/requirements.txt
        agentic-lens/.venv/bin/pip install -r /workspace/agent/requirements.txt
        
        # Patch ADK CLI to ensure query and stream_query are exported, required by Agent Gateway
        .venv/bin/python scripts/patch_cli.py $$(find agentic-lens/.venv -name cli_deploy.py | head -n 1)

        # Grant permissions and run deployment (skipping preflight verification since this is the initial greenfield deployment)
        export PROJECT_ID="$PROJECT_ID"
        export REGION="$_REGION"
        export MODEL_VERSION="$_MODEL_VERSION"
        export ORG_ID="$_ORG_ID"
        export SKIP_PREFLIGHT=1
        export SKIP_EXISTING=0
        
        # Dynamically replace the legacy hardcoded 'agentic-ai-lens' project ID with the current environment's PROJECT_ID in all agent configs
        find agentic-lens/agents -name ".agent_engine_config.json" -exec sed -i "s/agentic-ai-lens/$$PROJECT_ID/g" {} +
        
        # Apply the Vertex Gateway Wrapper to all agents to bypass the SDK 1.75 memory interceptor and expose 'query'
        .venv/bin/python scripts/patch_agent_wrapper.py
        
        DEPLOY_PARALLEL=2 ./deploy.sh
        
        # Export the resolved Supervisor Engine ID for the next stage
        .venv/bin/python scripts/get_agent_engine_id.py "$PROJECT_ID" "$_REGION" supervisor > /workspace/supervisor_id.txt
        echo "Successfully deployed agents. Supervisor ID: $(cat /workspace/supervisor_id.txt)"

  # =========================================================================
  # PHASE 3: App Container Build & Deploy (Cloud Run)
  # =========================================================================

  # 5. Build the Glass UI Docker container using Cloud Build docker runner
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-glass-ui-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd agentic-lens/app
        docker build -t "us-central1-docker.pkg.dev/$PROJECT_ID/prism-glass-ui/ai-prism-agent-glass-ui:$BUILD_ID" -f Dockerfile_glass_ui .

  # 6. Push the built image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-glass-ui-image'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/prism-glass-ui/ai-prism-agent-glass-ui:$BUILD_ID']

  # 7. Deploy to Cloud Run (with Direct VPC Egress for edge routing through SWP)
  - name: 'google/cloud-sdk:slim'
    id: 'deploy-glass-ui-to-run'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SUP_ID=$$(cat /workspace/supervisor_id.txt)
        if [[ "$$SUP_ID" == projects/* ]]; then
          SUPERVISOR_ENGINE="$$SUP_ID"
        else
          SUPERVISOR_ENGINE="projects/$PROJECT_ID/locations/us-central1/reasoningEngines/$$SUP_ID"
        fi
        
        if [[ "$PROJECT_ID" == "agentic-security-dev" ]]; then
          RUN_SERVICE_NAME="dev-ai-lens-ui"
        elif [[ "$PROJECT_ID" == "agentic-security-qa" ]]; then
          RUN_SERVICE_NAME="qa-ai-lens-ui"
        elif [[ "$PROJECT_ID" == "agentic-security-prd" ]]; then
          RUN_SERVICE_NAME="prd-ai-lens-ui"
        else
          RUN_SERVICE_NAME="ai-prism-agent-glass-ui"
        fi
        
        gcloud run deploy $$RUN_SERVICE_NAME \
          --image "us-central1-docker.pkg.dev/$PROJECT_ID/prism-glass-ui/ai-prism-agent-glass-ui:$BUILD_ID" \
          --region "$_REGION" \
          --network="gemini-corp-vpc" \
          --subnet="gemini-corp-swp-subnet" \
          --vpc-egress="all-traffic" \
          --ingress="all" \
          --iap \
          --allow-unauthenticated \
          --set-env-vars="GCP_PROJECT_ID=$PROJECT_ID,AGENTIC_LENS_SUPERVISOR_ENGINE=$$SUPERVISOR_ENGINE,PYTHONHTTPSVERIFY=0" \
          --quiet

# Optional substitution parameters (can be overridden manually when triggering the build)
substitutions:
  _MODEL_VERSION: 'gemini-2.5-pro'
  _ORG_ID: '873180247571'
  _REGION: 'us-central1'
  _IAP_CLIENT_ID: ''
  _IAP_CLIENT_SECRET: ''

options:
  logging: CLOUD_LOGGING_ONLY
