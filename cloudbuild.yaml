# Cloud Build pipeline for manual triggering to QA/Production environments
steps:
  # 0. Initialize and update git submodules (if .git folder is present)
  - name: 'gcr.io/cloud-builders/git'
    id: 'git-submodules'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -d .git ]; then
          echo "Git repo detected — initializing submodules..."
          git submodule init
          git submodule update --init --recursive
        else
          echo "No .git directory (manual build via gcloud builds submit)."
          echo "Cloning agentic-lens submodule directly from GitHub..."
          rm -rf agentic-lens
          git clone https://github.com/mgaur10/agentic-lens.git agentic-lens
          echo "Submodule clone complete."
          echo "Syncing app bundle from submodule into agentic-lens/app/..."
          bash agentic-lens/sync-app-bundle.sh 2>/dev/null || \
            rsync -a --delete agentic-lens/ agentic-lens/app/agentic-lens/ \
              --exclude='.git' --exclude='app/' 2>/dev/null || \
            echo "Sync skipped — app bundle may already be present in source upload."
        fi

  # =========================================================================
  # PHASE 1: Infrastructure Deployment (Terraform)
  # =========================================================================

  # 1. Initialize Terraform (using GCS backend for state management)
  - name: 'hashicorp/terraform:1.5.7'
    id: 'tf-init'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "$PROJECT_ID" = "agentic-security-dev" ]; then
          BUCKET="${PROJECT_ID}-tf-state"
        else
          BUCKET="${PROJECT_ID}-tfstate"
        fi
        terraform init -backend-config="bucket=$$BUCKET"

  # 2. Validate Terraform Configuration
  - name: 'hashicorp/terraform:1.5.7'
    id: 'tf-validate'
    args: ['validate']

  # 3a-pre. Clear any stale Terraform state lock from a previous interrupted build.
  # gsutil rm returns non-zero if the lock does not exist — use || true so it never fails the build.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'tf-clear-stale-lock'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$PROJECT_ID" = "agentic-security-dev" ]; then
          BUCKET="${PROJECT_ID}-tf-state"
        else
          BUCKET="${PROJECT_ID}-tfstate"
        fi
        echo "Checking for stale TF lock in gs://$$BUCKET/default.tflock ..."
        if gsutil -q stat gs://$$BUCKET/default.tflock 2>/dev/null; then
          echo "Stale lock found — removing ..."
          gsutil rm gs://$$BUCKET/default.tflock && echo "✅ Stale TF lock cleared" || echo "⚠️ Could not remove lock (will retry in tf-apply)"
        else
          echo "✅ No stale TF lock present"
        fi

  # 3a. Apply Terraform Configuration (provisions networks, SWP, dashboards, and metrics with alerts disabled)
  # NOTE: org_monitored_project_ids set to [] here to skip MonitoredProject creation (done separately below)
  - name: 'hashicorp/terraform:1.5.7'
    id: 'tf-apply-metrics'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        terraform apply \
          -var-file=envs/$PROJECT_ID.terraform.tfvars \
          -var=enable_token_alerts=false \
          -var=enable_model_armor_security_alerts=false \
          -var=iap_client_id=$_IAP_CLIENT_ID \
          -var=iap_client_secret=$_IAP_CLIENT_SECRET \
          -var='org_monitored_project_ids=[]' \
          -auto-approve || echo "WARNING: tf-apply-metrics had errors (likely cross-project monitoring IAM — non-fatal for agent deploy). Continuing..."

  # 3a-ii. Best-effort: add external projects to org metrics scope (requires cross-project IAM)
  # Uses || true so a 403 on external projects does NOT fail the build
  - name: 'hashicorp/terraform:1.5.7'
    id: 'tf-link-org-projects'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Attempting to link org monitored projects (best-effort — 403s are non-fatal)..."
        terraform apply \
          -var-file=envs/$PROJECT_ID.terraform.tfvars \
          -var=enable_token_alerts=false \
          -var=enable_model_armor_security_alerts=false \
          -var=iap_client_id=$_IAP_CLIENT_ID \
          -var=iap_client_secret=$_IAP_CLIENT_SECRET \
          -auto-approve || echo "WARNING: Org project linking failed (likely cross-project IAM). Skipping."

  # 3b. Wait for Cloud Monitoring to index newly created metrics
  - name: 'google/cloud-sdk:slim'
    id: 'sleep-for-metrics'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Sleeping 90 seconds to allow Cloud Monitoring to index newly created metrics..."
        sleep 90

  # 3c. Apply Terraform Configuration (enables and creates the alert policies)
  - name: 'hashicorp/terraform:1.5.7'
    id: 'tf-apply-alerts'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        terraform apply \
          -var-file=envs/$PROJECT_ID.terraform.tfvars \
          -var=iap_client_id=$_IAP_CLIENT_ID \
          -var=iap_client_secret=$_IAP_CLIENT_SECRET \
          -var='org_monitored_project_ids=[]' \
          -auto-approve || echo "WARNING: tf-apply-alerts had errors (likely cross-project monitoring IAM — non-fatal for agent deploy). Continuing..."

  # =========================================================================
  # PHASE 2: Reasoning Engine Deployments (Vertex AI)
  # =========================================================================

  # 3c. Best-effort: apply custom org policies required for AGENT_IDENTITY + agent_gateway_config
  # Cloud Build SA lacks orgpolicy.policies.create — uses || true so 403s are non-fatal.
  # These policies are pre-applied via elevated ADC; this step ensures enforcement on new projects.
  - name: 'google/cloud-sdk:slim'
    id: 'apply-org-policies'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Applying custom org policies (best-effort — 403s are non-fatal)..."
        for POLICY in enforceReasoningEngineAgentGatewayConfig \
                      enforceAgentIdentityForReasoningEngine \
                      enforceReasoningEngineOtelConfig; do
          cat > /tmp/policy_$${POLICY}.yaml << EOF
        name: projects/$PROJECT_ID/policies/custom.$${POLICY}
        spec:
          rules:
          - enforce: true
        EOF
          gcloud org-policies set-policy /tmp/policy_$${POLICY}.yaml \
            --project="$PROJECT_ID" \
            && echo "  ✅ $$POLICY" \
            || echo "  ⚠️  $$POLICY skipped (pre-applied via elevated ADC — non-fatal)"
        done

  # 4. Deploy all 12 Reasoning Engines to Vertex AI
  - name: 'google/cloud-sdk:slim'
    id: 'deploy-agents'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        
        # Install python3-venv and rsync which are required for venv and syncing
        apt-get update && apt-get install -y python3-venv rsync
        
        # Skipping sync-app-bundle.sh in Cloud Build since all deployable source files
        # (backend, infra, scripts, tests) are already present and tracked under agentic-lens/app/
        echo "Deployable app bundle is already populated under agentic-lens/app/. Skipping sync."
        
        # Change into the synced app directory to install deps and deploy
        cd agentic-lens/app
        
        # Populate versions.env for target environment
        echo "PROJECT_ID=$PROJECT_ID" > versions.env
        echo "REGION=$_REGION" >> versions.env
        echo "MODEL_VERSION=$_MODEL_VERSION" >> versions.env
        echo "ORG_ID=$_ORG_ID" >> versions.env
        
        # Remove any pre-existing .venv symlinks/folders to avoid 'File exists' errors
        rm -rf .venv
        rm -rf agentic-lens/.venv

        # Set up python environment and install google-adk
        python3 -m venv .venv
        .venv/bin/pip install --upgrade pip
        .venv/bin/pip install -r requirements.txt
        
        python3 -m venv agentic-lens/.venv
        agentic-lens/.venv/bin/pip install --upgrade pip
        agentic-lens/.venv/bin/pip install -r agentic-lens/app/requirements.txt
        agentic-lens/.venv/bin/pip install -r /workspace/agent/requirements.txt
        
        # Patch ADK CLI to ensure query and stream_query are exported, required by Agent Gateway
        .venv/bin/python scripts/patch_cli.py $$(find agentic-lens/.venv -name cli_deploy.py | head -n 1)

        # Grant permissions and run deployment (skipping preflight verification since this is the initial greenfield deployment)
        export PROJECT_ID="$PROJECT_ID"
        export REGION="$_REGION"
        export MODEL_VERSION="$_MODEL_VERSION"
        export ORG_ID="$_ORG_ID"
        export SKIP_PREFLIGHT=1
        export SKIP_EXISTING=0

        # Pre-deploy cleanup: delete stuck/UNKNOWN engines from prior failed builds.
        # Without this the deploy tool finds them by display_name and calls
        # UpdateReasoningEngine which Vertex AI rejects (code 3) on non-ACTIVE engines.
        # Skipped for agentic-ai-lens (Dev) to protect live engines.
        if [ "$PROJECT_ID" != "agentic-ai-lens" ]; then
          echo "--- Pre-deploy: checking for stuck reasoning engines in $PROJECT_ID ---"
          TOKEN=$$(gcloud auth print-access-token)
          RESP=$$(curl -s -H "Authorization: Bearer $$TOKEN" \
            "https://us-central1-aiplatform.googleapis.com/v1beta1/projects/$PROJECT_ID/locations/$_REGION/reasoningEngines")
          STUCK_IDS=$$(echo "$$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); bad=[e['name'].split('/')[-1] for e in d.get('reasoningEngines',[]) if e.get('state','UNKNOWN') not in ('ACTIVE',)]; print(' '.join(bad))" 2>/dev/null || echo "")
          TOTAL=$$(echo "$$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('reasoningEngines',[])))" 2>/dev/null || echo "0")
          echo "  Found $$TOTAL existing engines. Stuck IDs: $${STUCK_IDS:-none}"
          COUNT=0
          for EID in $$STUCK_IDS; do
            TOKEN=$$(gcloud auth print-access-token)
            curl -s -X DELETE \
              -H "Authorization: Bearer $$TOKEN" \
              "https://us-central1-aiplatform.googleapis.com/v1beta1/projects/$PROJECT_ID/locations/$_REGION/reasoningEngines/$$EID?force=true" \
              > /dev/null 2>&1
            echo "  Deleted stuck engine: $$EID"
            COUNT=$$((COUNT+1))
            if [ $$((COUNT % 5)) -eq 0 ]; then
              echo "  Rate limit pause (65s)..."
              sleep 65
            fi
          done
          if [ $$COUNT -gt 0 ]; then
            echo "  Deleted $$COUNT stuck engine(s). Waiting 30s before deploy..."
            sleep 30
          else
            echo "  No stuck engines found — clean slate."
          fi
        fi

        # Dynamically replace the legacy hardcoded 'agentic-ai-lens' project ID with the current environment's PROJECT_ID in all agent configs
        # Note: working dir is already agentic-lens/app — so agents are at agentic-lens/agents/ relative to here
        find agentic-lens/agents -name ".agent_engine_config.json" -exec sed -i \
          -e "s|agentic-ai-lens|$PROJECT_ID|g" \
          -e "s|795375693569|$$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')|g" \
          {} +

        # Also patch agent_gateway_config if the target env uses different gateway names.
        # Dev (agentic-ai-lens) uses main-ingress-agw / main-egress-agw-v2.
        # QA/PRD TF creates gemini-corp-ingress-gateway / gemini-corp-egress-gateway (from prefix).
        # Detect which gateways actually exist and patch accordingly.
        INGRESS_GW=$$(gcloud network-services agent-gateways list \
          --project="$PROJECT_ID" --location="$_REGION" \
          --format="value(name.basename())" 2>/dev/null | grep -i ingress | head -1 || echo "")
        EGRESS_GW=$$(gcloud network-services agent-gateways list \
          --project="$PROJECT_ID" --location="$_REGION" \
          --format="value(name.basename())" 2>/dev/null | grep -i egress | head -1 || echo "")
        if [ -n "$$INGRESS_GW" ]; then
          echo "Patching ingress gateway → $$INGRESS_GW"
          find agentic-lens/agents -name ".agent_engine_config.json" -exec sed -i \
            "s|gemini-corp-ingress-gateway|$$INGRESS_GW|g; s|main-ingress-agw|$$INGRESS_GW|g" {} +
        fi
        if [ -n "$$EGRESS_GW" ]; then
          echo "Patching egress gateway → $$EGRESS_GW"
          find agentic-lens/agents -name ".agent_engine_config.json" -exec sed -i \
            "s|gemini-corp-egress-gateway|$$EGRESS_GW|g; s|main-egress-agw-v2|$$EGRESS_GW|g" {} +
        fi

        # Apply the Vertex Gateway Wrapper to all agents to bypass the SDK 1.75 memory interceptor and expose 'query'
        .venv/bin/python scripts/patch_agent_wrapper.py

        # PRD Vertex AI backend rejects concurrent ReasoningEngine creates (code 13 INTERNAL).
        # Use DEPLOY_PARALLEL=1 for PRD to serialize deployments and avoid the race condition.
        # DEV also uses DEPLOY_PARALLEL=1: it always starts from 0 existing engines, so all 12
        # agents must CREATE (not update) concurrently — which triggers the same code 13 issue.
        # QA keeps DEPLOY_PARALLEL=2 since most runs UPDATE existing engines (faster, no race).
        if [ "$PROJECT_ID" = "agentic-security-prd" ] || [ "$PROJECT_ID" = "agentic-security-dev" ]; then
          DEPLOY_PARALLEL=1 ./deploy.sh
        else
          DEPLOY_PARALLEL=2 ./deploy.sh
        fi
        
        # Export the resolved Supervisor Engine ID for the next stage
        .venv/bin/python scripts/get_agent_engine_id.py "$PROJECT_ID" "$_REGION" supervisor > /workspace/supervisor_id.txt
        echo "Successfully deployed agents. Supervisor ID: $$(cat /workspace/supervisor_id.txt)"

        # Export other engine IDs so deploy-glass-ui-to-run can set them as Cloud Run env vars.
        # This avoids expensive Vertex AI list() lookups on every Cloud Run request.
        .venv/bin/python scripts/get_agent_engine_id.py "$PROJECT_ID" "$_REGION" chat > /workspace/chat_engine_id.txt 2>/dev/null || true
        .venv/bin/python scripts/get_agent_engine_id.py "$PROJECT_ID" "$_REGION" eng_lead > /workspace/eng_lead_engine_id.txt 2>/dev/null || true
        .venv/bin/python scripts/get_agent_engine_id.py "$PROJECT_ID" "$_REGION" xray_manager > /workspace/xray_manager_engine_id.txt 2>/dev/null || true
        .venv/bin/python scripts/get_agent_engine_id.py "$PROJECT_ID" "$_REGION" events > /workspace/events_engine_id.txt 2>/dev/null || true
        echo "Engine IDs captured: chat=$$(cat /workspace/chat_engine_id.txt 2>/dev/null) eng=$$(cat /workspace/eng_lead_engine_id.txt 2>/dev/null) xray=$$(cat /workspace/xray_manager_engine_id.txt 2>/dev/null) events=$$(cat /workspace/events_engine_id.txt 2>/dev/null)"

  # =========================================================================
  # PHASE 3: App Container Build & Deploy (Cloud Run)
  # =========================================================================

  # 5. Build the Glass UI Docker container using Cloud Build docker runner
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-glass-ui-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd agentic-lens/app
        docker build -t "us-central1-docker.pkg.dev/$PROJECT_ID/prism-glass-ui/ai-prism-agent-glass-ui:$BUILD_ID" -f Dockerfile_glass_ui .

  # 6. Push the built image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-glass-ui-image'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/prism-glass-ui/ai-prism-agent-glass-ui:$BUILD_ID']

  # 7. Deploy to Cloud Run (with Direct VPC Egress for edge routing through SWP)
  - name: 'google/cloud-sdk:slim'
    id: 'deploy-glass-ui-to-run'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SUP_ID=$$(cat /workspace/supervisor_id.txt)
        if [[ "$$SUP_ID" == projects/* ]]; then
          SUPERVISOR_ENGINE="$$SUP_ID"
        else
          SUPERVISOR_ENGINE="projects/$PROJECT_ID/locations/us-central1/reasoningEngines/$$SUP_ID"
        fi
        
        if [[ "$PROJECT_ID" == "agentic-security-dev" ]]; then
          RUN_SERVICE_NAME="dev-ai-lens-ui"
        elif [[ "$PROJECT_ID" == "agentic-security-qa" ]]; then
          RUN_SERVICE_NAME="qa-ai-lens-ui"
        elif [[ "$PROJECT_ID" == "agentic-security-prd" ]]; then
          RUN_SERVICE_NAME="prd-ai-lens-ui"
        else
          RUN_SERVICE_NAME="ai-prism-agent-glass-ui"
        fi
        
        # Read all engine IDs written by deploy-agents step so we can pass them
        # directly to Cloud Run — avoids expensive Vertex AI list() calls on each request.
        CHAT_ID=$(cat /workspace/chat_engine_id.txt 2>/dev/null || echo "")
        ENG_ID=$(cat /workspace/eng_lead_engine_id.txt 2>/dev/null || echo "")
        XRAY_ID=$(cat /workspace/xray_manager_engine_id.txt 2>/dev/null || echo "")
        EVENTS_ID=$(cat /workspace/events_engine_id.txt 2>/dev/null || echo "")

        EXTRA_ENVS="GCP_PROJECT_ID=$PROJECT_ID,GCP_LOCATION=$_REGION,AGENTIC_LENS_SUPERVISOR_ENGINE=$$SUPERVISOR_ENGINE,PYTHONHTTPSVERIFY=0"
        [[ -n "$$CHAT_ID" ]] && EXTRA_ENVS="$$EXTRA_ENVS,CHAT_ENGINE_ID=$$CHAT_ID"
        [[ -n "$$ENG_ID" ]] && EXTRA_ENVS="$$EXTRA_ENVS,ENG_ENGINE_ID=$$ENG_ID"
        [[ -n "$$XRAY_ID" ]] && EXTRA_ENVS="$$EXTRA_ENVS,XRAY_ENGINE_ID=$$XRAY_ID"
        [[ -n "$$EVENTS_ID" ]] && EXTRA_ENVS="$$EXTRA_ENVS,EVENTS_ENGINE_ID=$$EVENTS_ID"

        gcloud run deploy $$RUN_SERVICE_NAME \
          --image "us-central1-docker.pkg.dev/$PROJECT_ID/prism-glass-ui/ai-prism-agent-glass-ui:$BUILD_ID" \
          --region "$_REGION" \
          --network="gemini-corp-vpc" \
          --subnet="gemini-corp-swp-subnet" \
          --vpc-egress="all-traffic" \
          --ingress="all" \
          --iap \
          --allow-unauthenticated \
          --set-env-vars="$$EXTRA_ENVS" \
          --quiet

# Optional substitution parameters (can be overridden manually when triggering the build)
substitutions:
  _MODEL_VERSION: 'gemini-2.5-pro'
  _ORG_ID: '873180247571'
  _REGION: 'us-central1'
  _IAP_CLIENT_ID: ''
  _IAP_CLIENT_SECRET: ''

options:
  logging: CLOUD_LOGGING_ONLY

# 2-hour build timeout: PRD uses DEPLOY_PARALLEL=1 (serial) which takes ~48 min for 12 agents
# + ~20 min TF steps + ~10 min Cloud Run build = ~78 min total.
timeout: 7200s
